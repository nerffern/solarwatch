<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Startup validation failed</title>
  </head>
  <body>
    <main>
      <h1>Startup validation failed</h1>
      <p>
        The application cannot start normally because one or more required
        startup checks failed. Resolve the issues below and restart the app.
      </p>
      <ul>
        {% for error in errors %}
          <li>{{ error }}</li>
        {% endfor %}
      </ul>
    </main>
  </body>
</html>
