{% extends "base.html" %}
{% block title %} — Sign in{% endblock %}
{% block content %}
<div class="sw-center-wrap">
  <div class="sw-auth-card">
    <div class="sw-auth-logo">☀️ SolarWatch</div>
    <div class="sw-auth-subtitle">Sign in to your account</div>

    <form method="post">
      <div class="sw-field" style="margin-bottom:.9rem">
        <label for="username">Username</label>
        <input class="sw-input" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="sw-field" style="margin-bottom:1.25rem">
        <label for="password">Password</label>
        <input class="sw-input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="sw-btn primary" style="width:100%;justify-content:center;padding:.65rem" type="submit">
        Sign in
      </button>
    </form>
  </div>
</div>
{% endblock %}
