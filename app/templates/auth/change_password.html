{% extends "base.html" %}

{% block content %}
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">
        <h1 class="h3 mb-3">Update your password</h1>
        <p class="text-muted">
          Your account requires a password update before you can continue.
        </p>
        <form method="post" class="card card-body shadow-sm">
          
          <div class="mb-3">
            <label class="form-label" for="current_password">Current password</label>
            <input class="form-control" id="current_password" name="current_password" type="password" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="new_password">New password</label>
            <input class="form-control" id="new_password" name="new_password" type="password" required>
            <div class="form-text">Use at least 8 characters with letters and numbers.</div>
          </div>
          <button class="btn btn-primary w-100" type="submit">Update password</button>
        </form>
      </div>
    </div>
  </main>
{% endblock %}
