{% extends "base.html" %}
{% block title %} — Update password{% endblock %}
{% block content %}
<div class="sw-center-wrap">
  <div class="sw-auth-card">
    <div class="sw-auth-logo">🔒 Update password</div>
    <div class="sw-auth-subtitle">Your account requires a password update before you can continue.</div>

    <form method="post">
      <div class="sw-field" style="margin-bottom:.9rem">
        <label for="current_password">Current password</label>
        <input class="sw-input" id="current_password" name="current_password" type="password" required autofocus>
      </div>
      <div class="sw-field" style="margin-bottom:.4rem">
        <label for="new_password">New password</label>
        <input class="sw-input" id="new_password" name="new_password" type="password" required>
      </div>
      <p class="sw-field-hint" style="margin-bottom:1.25rem">At least 8 characters with letters and numbers.</p>
      <button class="sw-btn primary" style="width:100%;justify-content:center;padding:.65rem" type="submit">
        Update password
      </button>
    </form>
  </div>
</div>
{% endblock %}
