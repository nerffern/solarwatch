# deploy/tenants/example/values.yaml
#
# Copy this to deploy/tenants/<name>/values.yaml and fill in real values.
#
# Deploy:
#   helm upgrade --install solarwatch deploy/helm/solarwatch \
#     -f deploy/tenants/example/values.yaml \
#     --namespace solarwatch --create-namespace

image:
  repository: registry.hfisystems.com/hfisystems/solarwatch
  tag: "1.0.0"
  pullPolicy: Always
  pullSecret: hfisystems-registry

# Web app: 2 replicas minimum — one in xne, one in lnr
# Spread enforced by topologySpreadConstraints on topology.kubernetes.io/zone
replicaCount: 2
gunicornWorkers: 2

# Collector: single pod pinned to the zone with inverter access
collector:
  enabled: true
  zone: lnr          # Change to xne if inverters are reachable from Xneelo
  pollInterval: "60"
  weatherInterval: "900"
  configReload: "300"
  maxRetries: "3"
  retryDelay: "5"

# Database — matches setup.sql defaults
database:
  host: postgres-ha.hfisystems.com
  port: "5432"
  name: solarwatch
  user: solarwatch_user
  password: "REPLACE-WITH-REAL-PASSWORD"

# Secrets — set these before deploying
secrets:
  secretKey: "REPLACE-WITH-python-secrets-token-hex-32"
  adminUsername: admin
  adminPassword: "REPLACE-BEFORE-FIRST-LOGIN"

env:
  APP_ENV: production
  APP_PROXY_FIX: "true"
  DB_POOL_SIZE: "3"
  DB_MAX_OVERFLOW: "2"
  DB_POOL_TIMEOUT: "30"
  RATE_LIMIT_LOGIN: "10/minute"
  RATE_LIMIT_DEFAULT: "60/minute"

readinessProbe:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6
  successThreshold: 1

livenessProbe:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 6

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

collectorResources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  port: 80
  targetPort: 8000

# Cloudflare Tunnel is used for ingress — no K8s Ingress needed.
# Point your Cloudflare tunnel config to:
#   http://solarwatch.<namespace>.svc.cluster.local:80
ingress:
  enabled: false
