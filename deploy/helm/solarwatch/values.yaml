# SolarWatch Helm values
# Copy this file to deploy/tenants/<name>/values.yaml and customise.
# Then deploy with:
#   helm upgrade --install solarwatch deploy/helm/solarwatch \
#     -f deploy/tenants/<name>/values.yaml \
#     --namespace <namespace> --create-namespace

# ── Image ─────────────────────────────────────────────────────────────────────
image:
  repository: registry.hfisystems.com/hfisystems/solarwatch
  tag: latest
  pullPolicy: Always

# Set to the name of your docker-registry secret if using a private registry
# kubectl create secret docker-registry hfisystems-registry \
#   --docker-server=registry.hfisystems.com \
#   --docker-username=<user> --docker-password=<token> \
#   --namespace <namespace>
imagePullSecrets: []
# - name: hfisystems-registry

# ── Deployment ────────────────────────────────────────────────────────────────
replicaCount: 2

# Gunicorn workers per pod.
# Rule of thumb: (2 × CPU cores) + 1. For 1 vCPU pods, 2 is correct.
# Increase replicaCount to scale throughput — not workers.
gunicornWorkers: 2

# Resource requests and limits per pod.
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Rolling update strategy — ensures zero downtime deploys.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# ── Application secrets (store in K8s Secret, reference here) ─────────────────
# These values are mounted as environment variables from a Secret named
# <release-name>-secrets. Override them in your tenant values file.
secrets:
  # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
  # Must be IDENTICAL across all replicas and stable across restarts.
  secretKey: "CHANGE-ME-generate-a-real-32-char-secret"
  # Full SQLAlchemy URL to your HA PostgreSQL cluster
  databaseUrl: "postgresql+psycopg2://solarwatch_user:CHANGEME@your-postgres-host:5432/solarwatch"
  # Bootstrap admin credentials — forced password change on first login
  adminUsername: "admin"
  adminPassword: "CHANGE-ME-on-first-login"

# ── Application config (non-sensitive) ────────────────────────────────────────
env:
  APP_ENV: production
  APP_PROXY_FIX: "true"   # Required behind Traefik / ingress-nginx / Cloudflare
  # DB pool per worker. max_connections = pods × workers × (POOL_SIZE + MAX_OVERFLOW)
  # Default: 2 pods × 2 workers × (3 + 2) = 20 connections
  DB_POOL_SIZE: "3"       # matches .env.example default
  DB_MAX_OVERFLOW: "2"    # max_connections = pods × workers × (POOL_SIZE + OVERFLOW)
  DB_POOL_TIMEOUT: "30"
  RATE_LIMIT_LOGIN: "10/minute"
  RATE_LIMIT_DEFAULT: "60/minute"
  # APP_VERSION is read from the VERSION file baked into the image

# ── Service ───────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: "nginx"      # or "traefik"
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # cert-manager.io/cluster-issuer: letsencrypt-prod
  host: solarwatch.example.com
  tls: []
  # - secretName: solarwatch-tls
  #   hosts:
  #     - solarwatch.example.com

# ── Cloudflare Tunnel (alternative to Ingress) ────────────────────────────────
# If you use cloudflared instead of ingress, set ingress.enabled: false
# and configure your Cloudflare tunnel to point to the Service ClusterIP:80.
# No LoadBalancer or NodePort needed.

# ── Health probes ─────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 2

# ── Pod topology spread (multi-DC) ────────────────────────────────────────────
# Ensures pods spread across nodes/zones. Adjust topologyKey to match
# your cluster's node labels (topology.kubernetes.io/zone for cloud,
# kubernetes.io/hostname for on-prem bare metal across DCs).
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app: solarwatch

# ── Namespace ─────────────────────────────────────────────────────────────────
namespace: solarwatch
