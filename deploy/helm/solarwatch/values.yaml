# SolarWatch Helm values
# Mirrors the WTS chart structure so both projects deploy the same way.
#
# Usage:
#   Copy deploy/tenants/example/values.yaml to deploy/tenants/<name>/values.yaml
#   Edit the tenant file — do not edit this file directly.
#
#   helm upgrade --install solarwatch deploy/helm/solarwatch \
#     -f deploy/tenants/<name>/values.yaml \
#     --namespace solarwatch-<name>

# ── Image ─────────────────────────────────────────────────────────────────────
image:
  repository: registry.hfisystems.com/hfisystems/solarwatch
  tag: "1.0.0"
  pullPolicy: Always
  pullSecret: hfisystems-registry   # name of docker-registry secret in the namespace

# ── Web app replicas ──────────────────────────────────────────────────────────
# 3 = one pod per zone (lnr, xne, pen) — recommended for full 3-site HA.
replicaCount: 3

# Gunicorn workers per pod. Rule: (2 × vCPU) + 1. For 1 vCPU pods → 2.
# Scale throughput by adding pods (replicaCount), not workers.
gunicornWorkers: 2

# ── Collector ─────────────────────────────────────────────────────────────────
# The collector runs as a single pod (replicaCount: 1). It must not run
# more than one active instance — see Option A notes in README.
# Set enabled: true once the namespace and DB are provisioned.
collector:
  enabled: true
  # Zone failover is automatic: lnr (preferred) → xne → pen.
  # No zone config needed — see deployment.yaml affinity weights.
  pollInterval: "60"
  weatherInterval: "900"
  configReload: "300"
  maxRetries: "3"
  retryDelay: "5"
  # How often to poll Sungrow iSolarCloud (seconds).
  # iSolarCloud refreshes data every ~5 minutes — polling more often wastes API quota.
  sungrowPollInterval: "60"

# ── Database credentials ───────────────────────────────────────────────────────
# Assembled into the solarwatch-secrets Secret by the secret.yaml template.
# Match these exactly with what you set in setup.sql.
database:
  host: postgres-ha.hfisystems.com
  port: "5432"
  name: solarwatch
  user: solarwatch_user
  password: change-me

# ── Application secrets ────────────────────────────────────────────────────────
# secretKey: generate with:
#   python -c "import secrets; print(secrets.token_hex(32))"
# Must be IDENTICAL across all web app pods and stable across restarts.
# Changing it invalidates all active sessions.
secrets:
  secretKey: ""          # REQUIRED — set in your tenant values file
  adminUsername: admin
  adminPassword: change-me-on-first-login
  # Sungrow iSolarCloud developer app credentials.
  # Set in your tenant values file — leave empty if no Sungrow sites.
  sungrowAppkey: ""
  sungrowSecret: ""
  sungrowRegion: "hk"   # hk = Asia-Pacific/South Africa, eu = Europe

# ── Non-sensitive environment config ──────────────────────────────────────────
env:
  APP_ENV: production
  APP_PROXY_FIX: "true"   # Required — Cloudflare tunnel sets X-Forwarded-For
  DB_POOL_SIZE: "3"
  DB_MAX_OVERFLOW: "2"
  DB_POOL_TIMEOUT: "30"
  RATE_LIMIT_LOGIN: "10/minute"
  RATE_LIMIT_DEFAULT: "60/minute"

# ── Health probes ──────────────────────────────────────────────────────────────
readinessProbe:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6
  successThreshold: 1

livenessProbe:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 6

# ── Resources ──────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

collectorResources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ── Service ────────────────────────────────────────────────────────────────────
service:
  port: 80
  targetPort: 8000

# ── Ingress (optional — not needed if using Cloudflare Tunnel) ────────────────
# With Cloudflare Tunnel, set enabled: false and point your tunnel config
# to the Service ClusterIP:80 or the DNS name solarwatch.<namespace>.svc.cluster.local
ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: solarwatch.example.com
  tls: []
