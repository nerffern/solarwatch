# ── Web app Deployment ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "solarwatch.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: solarwatch
    component: web
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: solarwatch
      component: web
  template:
    metadata:
      labels:
        app: solarwatch
        component: web
        release: {{ .Release.Name }}
      annotations:
        # Force pod restart when secrets change (matches WTS pattern)
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}

      # Spread web pods across zones (xne, lnr) — matches your WTS topology.
      # Requires nodes to be labelled: topology.kubernetes.io/zone=xne|lnr
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: solarwatch
              component: web

      containers:
        - name: solarwatch-web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              protocol: TCP
          command:
            - gunicorn
            - main:app
            - --worker-class
            - uvicorn.workers.UvicornWorker
            - --workers
            - {{ .Values.gunicornWorkers | quote }}
            - --bind
            - 0.0.0.0:8000
            - --timeout
            - "60"
            - --graceful-timeout
            - "30"
            - --keep-alive
            - "5"
            - --access-logfile
            - "-"
            - --error-logfile
            - "-"

          # All secrets from the shared Secret object (matches WTS envFrom pattern)
          envFrom:
            - secretRef:
                name: {{ include "solarwatch.secretName" . }}

          # Non-sensitive config as plain env vars
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: 8000
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}

          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: 8000
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}

---
# ── Collector Deployment ──────────────────────────────────────────────────────
{{- if .Values.collector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "solarwatch.fullname" . }}-collector
  namespace: {{ .Release.Namespace }}
  labels:
    app: solarwatch
    component: collector
    release: {{ .Release.Name }}
spec:
  # Always exactly 1 replica — multiple collector instances cause duplicate
  # polling and concurrent Modbus connections to the same inverter.
  replicas: 1
  selector:
    matchLabels:
      app: solarwatch
      component: collector
  template:
    metadata:
      labels:
        app: solarwatch
        component: collector
        release: {{ .Release.Name }}
      annotations:
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}

      # Pin collector to a specific zone — the one with inverter network access.
      # Change collector.zone in values.yaml to move it between DCs.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - {{ .Values.collector.zone | quote }}

      # If the collector crashes, restart it. Never replace with 0 replicas.
      # Kubernetes handles restarts automatically.
      restartPolicy: Always

      containers:
        - name: solarwatch-collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - collector.py

          # Collector uses PG_* vars from the shared secret
          envFrom:
            - secretRef:
                name: {{ include "solarwatch.secretName" . }}

          # Collector-specific config
          env:
            - name: POLL_INTERVAL
              value: {{ .Values.collector.pollInterval | quote }}
            - name: WEATHER_INTERVAL
              value: {{ .Values.collector.weatherInterval | quote }}
            - name: CONFIG_RELOAD
              value: {{ .Values.collector.configReload | quote }}
            - name: MAX_RETRIES
              value: {{ .Values.collector.maxRetries | quote }}
            - name: RETRY_DELAY
              value: {{ .Values.collector.retryDelay | quote }}
            - name: PG_SSLMODE
              value: "prefer"

          resources:
            {{- toYaml .Values.collectorResources | nindent 12 }}

          # No HTTP health probe — collector is not a web server.
          # K8s will restart it if it crashes. Monitor via logs:
          #   kubectl logs -n <namespace> -l component=collector -f
{{- end }}
