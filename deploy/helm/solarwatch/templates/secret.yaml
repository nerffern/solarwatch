apiVersion: v1
kind: Secret
metadata:
  name: {{ include "solarwatch.secretName" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  # Web app secrets
  SECRET_KEY: {{ .Values.secrets.secretKey | required "secrets.secretKey is required" | quote }}
  DATABASE_URL: {{ include "solarwatch.databaseUrl" . | quote }}
  APP_ADMIN_USERNAME: {{ .Values.secrets.adminUsername | quote }}
  APP_ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  # Collector secrets (PG_* vars — separate from web app DATABASE_URL convention)
  PG_HOST: {{ include "solarwatch.pgHost" . | quote }}
  PG_PORT: {{ include "solarwatch.pgPort" . | quote }}
  PG_DB: {{ include "solarwatch.pgDb" . | quote }}
  PG_USER: {{ include "solarwatch.pgUser" . | quote }}
  PG_PASS: {{ include "solarwatch.pgPass" . | quote }}
