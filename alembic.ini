# Alembic configuration file.
# The sqlalchemy.url value below is overridden at runtime by env.py
# using the same DATABASE_URL / DB_* environment variables the app uses.
# You never need to hardcode credentials here.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Overridden by env.py — leave as placeholder.
sqlalchemy.url = postgresql+psycopg2://placeholder

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
